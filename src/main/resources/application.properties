spring.application.name=Employee_Hub
server.port=8080

# ---- Database connection (MySQL) ----
# The database "employee_db" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=9221

# ---- JPA / Hibernate ----
# update = Hibernate creates/updates the tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
